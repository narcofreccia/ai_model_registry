name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      promote:
        description: "Move the `stable` tag to this commit after validation"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # validate.py diffs registry.json against the `stable` tag
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Validate registry.json
        run: python scripts/validate.py
      - name: Adapter tests
        run: python -m pytest -q

  promote:
    # Manual release: force-move `stable`, which is what consumers read.
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Re-validate before promoting
        run: python scripts/validate.py
      - name: Move the stable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
      - name: Summary
        run: |
          echo "\`stable\` now points at \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
