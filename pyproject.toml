[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-model-registry"
version = "0.2.0"
description = "Centralized, facts-only registry of AI models: ids, providers, capabilities, USD list prices, lifecycle and id migrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "narcofreccia" }]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/narcofreccia/ai_model_registry"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_model_registry"]

# registry.json lives once, at the repo root, and is copied into the wheel as
# package data — no committed duplicate, no drift.
[tool.hatch.build.targets.wheel.force-include]
"registry.json" = "ai_model_registry/registry.json"

[tool.hatch.build.targets.sdist]
include = ["src/ai_model_registry", "registry.json", "schema", "scripts", "tests", "README.md", "MAINTAINING.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
